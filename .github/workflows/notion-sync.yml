name: Notion to GitHub Sync

on:
  workflow_dispatch: # 수동 실행
  schedule:
    - cron: '0 15 * * *' # 매일 밤 12시(한국시간) 실행

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch from Notion and Save
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python -c "
          import os, shutil, requests, json

          token = os.environ['NOTION_TOKEN']
          db_id = os.environ['NOTION_DATABASE_ID']

          headers = {
              'Authorization': f'Bearer {token}',
              'Notion-Version': '2022-06-28',
              'Content-Type': 'application/json'
          }

          def extract_text(rich_texts):
              if not rich_texts:
                  return ''
              return ''.join([t.get('plain_text', '') for t in rich_texts])

          def get_all_blocks(block_id):
              blocks = []
              cursor = None
              while True:
                  url = f'[https://api.notion.com/v1/blocks/](https://api.notion.com/v1/blocks/){block_id}/children?page_size=100'
                  if cursor:
                      url += f'&start_cursor={cursor}'
                  res = requests.get(url, headers=headers).json()
                  results = res.get('results', [])
                  blocks.extend(results)
                  if not res.get('has_more'):
                      break
                  cursor = res.get('next_cursor')
              return blocks

          def render_blocks(blocks, indent=0):
              content = ''
              prefix = '  ' * indent
              for block in blocks:
                  btype = block.get('type')
                  data = block.get(btype, {})

                  line = ''
                  if btype == 'paragraph':
                      text = extract_text(data.get('rich_text', []))
                      line = f'{prefix}{text}\n\n' if text else '\n'
                  elif btype == 'heading_1':
                      text = extract_text(data.get('rich_text', []))
                      line = f'# {text}\n\n'
                  elif btype == 'heading_2':
                      text = extract_text(data.get('rich_text', []))
                      line = f'## {text}\n\n'
                  elif btype == 'heading_3':
                      text = extract_text(data.get('rich_text', []))
                      line = f'### {text}\n\n'
                  elif btype == 'bulleted_list_item':
                      text = extract_text(data.get('rich_text', []))
                      line = f'{prefix}* {text}\n'
                  elif btype == 'numbered_list_item':
                      text = extract_text(data.get('rich_text', []))
                      line = f'{prefix}1. {text}\n'
                  elif btype == 'to_do':
                      text = extract_text(data.get('rich_text', []))
                      checked = 'x' if data.get('checked') else ' '
                      line = f'{prefix}- [{checked}] {text}\n'
                  elif btype == 'code':
                      lang = data.get('language', '')
                      # 코드 블록 내부의 텍스트를 확실하게 추출
                      code_text = extract_text(data.get('rich_text', []))
                      line = f'```{lang}\n{code_text}\n```\n\n'
                  elif btype == 'quote':
                      text = extract_text(data.get('rich_text', []))
                      line = f'> {text}\n\n'
                  elif btype == 'callout':
                      text = extract_text(data.get('rich_text', []))
                      line = f'> 💡 {text}\n\n'
                  elif btype in ['toggle', 'toggle_heading_1', 'toggle_heading_2', 'toggle_heading_3']:
                      text = extract_text(data.get('rich_text', []))
                      line = f'<details><summary>{text}</summary>\n\n'
                  elif btype == 'divider':
                      line = '---\n\n'

                  content += line

                  if block.get('has_children'):
                      child_blocks = get_all_blocks(block['id'])
                      next_indent = indent + 1 if btype in ['bulleted_list_item', 'numbered_list_item', 'to_do'] else indent
                      content += render_blocks(child_blocks, next_indent)
                      if 'toggle' in btype:
                          content += '</details>\n\n'

              return content

          # 1. 기존 TIL 폴더 정리
          if os.path.exists('TIL'):
              shutil.rmtree('TIL')
          os.makedirs('TIL', exist_ok=True)

          # 2. 노션 데이터베이스 쿼리
          url = f'[https://api.notion.com/v1/databases/](https://api.notion.com/v1/databases/){db_id}/query'
          payload = {'filter': {'property': 'Published', 'checkbox': {'equals': True}}}
          res = requests.post(url, headers=headers, json=payload).json()

          for page in res.get('results', []):
              props = page['properties']
              
              title_list = props.get('Name', {}).get('title', [])
              if not title_list:
                  continue
              title = title_list[0]['plain_text']

              date_str = ''
              date_prop = props.get('Date') or props.get('날짜') or props.get('Created time')
              
              if date_prop:
                  if date_prop.get('type') == 'date' and date_prop.get('date'):
                      date_str = date_prop['date'].get('start', '')[:10]
                  elif date_prop.get('type') == 'created_time':
                      date_str = date_prop.get('created_time', '')[:10]

              page_id = page['id']
              page_blocks = get_all_blocks(page_id)
              
              content = f'# {title}\n\n'
              if date_str:
                  content = f'# {title}\n> 작성일: {date_str}\n\n'
              
              content += render_blocks(page_blocks)

              safe_title = ''.join(c for c in title if c.isalnum() or c in (' ', '_', '-')).strip().replace(' ', '_')
              
              if date_str:
                  filename = f'TIL/{date_str}_{safe_title}.md'
              else:
                  filename = f'TIL/{safe_title}.md'

              with open(filename, 'w', encoding='utf-8') as f:
                  f.write(content)
          "

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add TIL/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: Fix code block parsing issue"
            git push
          fi
