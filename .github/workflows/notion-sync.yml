name: Notion to GitHub Sync

on:
  workflow_dispatch: # 수동 실행 지원
  schedule:
    - cron: '0 15 * * *' # 매일 한국시간 00:00(밤 12시) 실행

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch from Notion and Save
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python -c "
          import os, requests, json

          token = os.environ['NOTION_TOKEN']
          db_id = os.environ['NOTION_DATABASE_ID']

          url = f'https://api.notion.com/v1/databases/{db_id}/query'
          headers = {
              'Authorization': f'Bearer {token}',
              'Notion-Version': '2022-06-28',
              'Content-Type': 'application/json'
          }
          payload = {
              'filter': {
                  'property': 'Published',
                  'checkbox': {'equals': True}
              }
          }

          res = requests.post(url, headers=headers, json=payload)
          data = res.json()

          os.makedirs('TIL', exist_ok=True)

          for page in data.get('results', []):
              props = page['properties']
              title_list = props.get('Name', {}).get('title', [])
              if not title_list:
                  continue
              title = title_list[0]['plain_text']
              
              # 노션 본문 가져오기
              page_id = page['id']
              blocks_url = f'https://api.notion.com/v1/blocks/{page_id}/children'
              blocks_res = requests.get(blocks_url, headers=headers).json()
              
              content = f'# {title}\n\n'
              for block in blocks_res.get('results', []):
                  btype = block['type']
                  if btype == 'paragraph':
                      texts = block['paragraph']['rich_text']
                      if texts:
                          content += ''.join([t['plain_text'] for t in texts]) + '\n\n'

              filename = f'TIL/{title}.md'.replace(' ', '_')
              with open(filename, 'w', encoding='utf-8') as f:
                  f.write(content)
          "

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "docs: Sync TIL from Notion"
