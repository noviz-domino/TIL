name: Notion to GitHub Sync

on:
  workflow_dispatch: # 수동 실행
  schedule:
    - cron: '0 15 * * *' # 매일 밤 12시(한국시간) 실행

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch from Notion and Save
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python -c "
          import os, requests, json

          token = os.environ['NOTION_TOKEN']
          db_id = os.environ['NOTION_DATABASE_ID']

          headers = {
              'Authorization': f'Bearer {token}',
              'Notion-Version': '2022-06-28',
              'Content-Type': 'application/json'
          }

          def extract_text(rich_texts):
              return ''.join([t.get('plain_text', '') for t in rich_texts])

          def block_to_md(block):
              btype = block.get('type')
              data = block.get(btype, {})
              
              if 'rich_text' in data:
                  text = extract_text(data['rich_text'])
              else:
                  text = ''

              if btype == 'paragraph':
                  return f'{text}\n\n' if text else '\n'
              elif btype == 'heading_1':
                  return f'# {text}\n\n'
              elif btype == 'heading_2':
                  return f'## {text}\n\n'
              elif btype == 'heading_3':
                  return f'### {text}\n\n'
              elif btype == 'bulleted_list_item':
                  return f'* {text}\n'
              elif btype == 'numbered_list_item':
                  return f'1. {text}\n'
              elif btype == 'to_do':
                  checked = 'x' if data.get('checked') else ' '
                  return f'- [{checked}] {text}\n'
              elif btype == 'code':
                  lang = data.get('language', '')
                  return f'```{lang}\n{text}\n```\n\n'
              elif btype == 'quote':
                  return f'> {text}\n\n'
              elif btype == 'callout':
                  return f'> 💡 {text}\n\n'
              elif btype == 'divider':
                  return '---\n\n'
              return ''

          # 데이터베이스 쿼리
          url = f'https://api.notion.com/v1/databases/{db_id}/query'
          payload = {'filter': {'property': 'Published', 'checkbox': {'equals': True}}}
          res = requests.post(url, headers=headers, json=payload).json()

          os.makedirs('TIL', exist_ok=True)

          for page in res.get('results', []):
              props = page['properties']
              title_list = props.get('Name', {}).get('title', [])
              if not title_list:
                  continue
              title = title_list[0]['plain_text']
              
              page_id = page['id']
              blocks_url = f'https://api.notion.com/v1/blocks/{page_id}/children?page_size=100'
              blocks_res = requests.get(blocks_url, headers=headers).json()
              
              content = f'# {title}\n\n'
              for block in blocks_res.get('results', []):
                  content += block_to_md(block)

              # 파일명 특수문자 정제
              safe_title = ''.join(c for c in title if c.isalnum() or c in (' ', '_', '-')).strip().replace(' ', '_')
              filename = f'TIL/{safe_title}.md'
              
              with open(filename, 'w', encoding='utf-8') as f:
                  f.write(content)
          "

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: Sync TIL content from Notion"
