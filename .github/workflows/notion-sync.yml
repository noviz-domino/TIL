name: Notion to GitHub Sync

on:
  workflow_dispatch: # 직접 실행 버튼 지원
  schedule:
    - cron: '0 15 * * *' # 매일 한국 시간 00:00(밤 12시)에 자동 실행

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Notion to GitHub Action
        uses: cronvel/notion-to-github-action@v1.0.0
        with:
          notion-token: ${{ secrets.NOTION_TOKEN }}
          notion-db-id: ${{ secrets.NOTION_DATABASE_ID }}
          filter-prop: 'Published' # 체크박스 속성 이름
          file-name-prop: 'Name'     # 노션 제목 속성 이름 (기본값: 이름 또는 Name)
          output-dir: 'TIL'          # 깃허브에 저장될 폴더 이름

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "docs: Auto sync from Notion TIL"
